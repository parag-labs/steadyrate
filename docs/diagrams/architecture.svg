<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1600" height="980" fill="#fbfcfe"/><text x="800.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">SteadyRate - five strategies, one interface</text><text x="800.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">One allow(now_ms) -&gt; bool call, the same burst, five different reactions - integer-only so all six ports agree.</text><rect x="565.984" y="140.0" width="150.03199999999998" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="641" y="156.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">allow(now_ms) -&gt; bool</text><rect x="48" y="168" width="270" height="352" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="66" y="159" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">ONE TIMELINE</text><rect x="66" y="206" width="234" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(82,221) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></g><text x="112" y="237" font-size="16.5" font-weight="700" fill="#17509f">allow(now_ms)</text><text x="83" y="259.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">returns allow / reject</text><text x="83" y="276.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">time is an argument</text><rect x="66" y="306" width="234" height="87" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(82,321) scale(0.8750)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/></g><text x="112" y="337" font-size="16.5" font-weight="700" fill="#3d4a63">One burst</text><text x="83" y="359.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">same timeline feeds</text><text x="83" y="376.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">all five strategies</text><rect x="66" y="406" width="234" height="87" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(82,421) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14M10 3L8 21M17 3l-2 18"/></g><text x="112" y="437" font-size="16.5" font-weight="700" fill="#136b74">Integer core</text><text x="83" y="459.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">fixed-point x1000</text><text x="83" y="476.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">no float, no clock</text><rect x="406" y="182" width="470" height="87" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(422,197) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/></g><text x="452" y="213" font-size="16.5" font-weight="700" fill="#186547">Token bucket</text><text x="423" y="235.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">tokens refill to capacity c</text><text x="423" y="252.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">each request spends one</text><rect x="406" y="306" width="470" height="87" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(422,321) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2"/><path d="M8 7v10"/><path d="M12 4v16"/><path d="M16 8v8"/><path d="M20 11v2"/></g><text x="452" y="337" font-size="16.5" font-weight="700" fill="#136b74">Leaky bucket</text><text x="423" y="359.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">a queue leaks at a fixed rate</text><text x="423" y="376.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">accept only if room to add</text><rect x="406" y="430" width="470" height="87" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(422,445) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14M10 3L8 21M17 3l-2 18"/></g><text x="452" y="461" font-size="16.5" font-weight="700" fill="#8c5a0d">Fixed window</text><text x="423" y="483.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">count per now // window_ms</text><text x="423" y="500.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the counter resets each window</text><rect x="406" y="554" width="470" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(422,569) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></g><text x="452" y="585" font-size="16.5" font-weight="700" fill="#17509f">Sliding window log</text><text x="423" y="607.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">keep recent timestamps</text><text x="423" y="624.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">count those in the window</text><rect x="406" y="678" width="470" height="87" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(422,693) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="452" y="709" font-size="16.5" font-weight="700" fill="#552fae">Sliding window counter</text><text x="423" y="731.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">blend prev + current by overlap</text><text x="423" y="748.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">compared by cross-multiply</text><rect x="980" y="168" width="524" height="608" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="998" y="159" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">BURST REACTION</text><rect x="998" y="182" width="488" height="87" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><text x="1015" y="213" font-size="16.5" font-weight="700" fill="#186547">Bursts to capacity</text><text x="1015" y="235.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">allows a burst up to c,</text><text x="1015" y="252.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">then throttles to rate r</text><rect x="998" y="306" width="488" height="87" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><text x="1015" y="337" font-size="16.5" font-weight="700" fill="#136b74">Steady drip</text><text x="1015" y="359.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">smooths a burst into a</text><text x="1015" y="376.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">constant output stream</text><rect x="998" y="430" width="488" height="87" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><text x="1015" y="461" font-size="16.5" font-weight="700" fill="#8c5a0d">2x at the boundary</text><text x="1015" y="483.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">simple and fastest, but</text><text x="1015" y="500.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">2x the limit across an edge</text><rect x="998" y="554" width="488" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><text x="1015" y="585" font-size="16.5" font-weight="700" fill="#17509f">Exact, costs memory</text><text x="1015" y="607.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">a precise count; memory</text><text x="1015" y="624.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">grows with the traffic</text><rect x="998" y="678" width="488" height="87" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><text x="1015" y="709" font-size="16.5" font-weight="700" fill="#552fae">Near-exact, O(1)</text><text x="1015" y="731.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">~4.5% off exact here;</text><text x="1015" y="748.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">two integers of state</text><path d="M300,350 L347.0,350.0 Q362,350 362.0,335.0 L362.0,241.0 Q362,226 377.0,226.0 L406,226" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><path d="M300,350 L361.5,350.0 Q362,350 362.0,350.0 L362.0,350.0 Q362,350 362.5,350.0 L406,350" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><path d="M300,350 L347.0,350.0 Q362,350 362.0,365.0 L362.0,459.0 Q362,474 377.0,474.0 L406,474" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><path d="M300,350 L347.0,350.0 Q362,350 362.0,365.0 L362.0,583.0 Q362,598 377.0,598.0 L406,598" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><path d="M300,350 L347.0,350.0 Q362,350 362.0,365.0 L362.0,707.0 Q362,722 377.0,722.0 L406,722" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><path d="M876,226 L998,226" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><path d="M876,350 L998,350" stroke="#2aa5b0" stroke-width="2.0" fill="none" marker-end="url(#ah-cyan)"/><path d="M876,474 L998,474" stroke="#e0a13a" stroke-width="2.0" fill="none" marker-end="url(#ah-amber)"/><path d="M876,598 L998,598" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><path d="M876,722 L998,722" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="48" y="812" width="728" height="113.6" rx="11" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.4" stroke-opacity="0.8"/><text x="64" y="836" font-size="13.2" font-weight="700" fill="#136b74">Integer-only, time-injected</text><text x="64" y="858" font-size="12.4" fill="#136b74" fill-opacity="0.92">allow(now_ms) takes the clock as an argument - never wall time.</text><text x="64" y="876.4" font-size="12.4" fill="#136b74" fill-opacity="0.92">Token and leak levels are fixed-point integers (scaled x1000).</text><text x="64" y="894.8" font-size="12.4" fill="#136b74" fill-opacity="0.92">The counter compares its estimate by cross-multiplying, not dividing.</text><text x="64" y="913.1999999999999" font-size="12.4" fill="#136b74" fill-opacity="0.92">So a decision is a pure function of (config, request timeline).</text><rect x="824" y="812" width="728" height="113.6" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="840" y="836" font-size="13.2" font-weight="700" fill="#186547">Six languages, one behaviour</text><text x="840" y="858" font-size="12.4" fill="#186547" fill-opacity="0.92">Python, Go, Rust, C#, Java, TypeScript replay one timeline.</text><text x="840" y="876.4" font-size="12.4" fill="#186547" fill-opacity="0.92">vectors.json pins every allow / reject, byte-for-byte.</text><text x="840" y="894.8" font-size="12.4" fill="#186547" fill-opacity="0.92">Fixed window ~3.45M/s, sliding counter ~1.2M/s (Python).</text><text x="840" y="913.1999999999999" font-size="12.4" fill="#186547" fill-opacity="0.92">The counter lands within ~4.5% of the exact sliding count.</text><text x="800.0" y="962" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/steadyrate</text></svg>